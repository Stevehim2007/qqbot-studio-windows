name: Windows dual EXE build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Run independent test suite
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        shell: pwsh
        run: python -m compileall -q qqbot_studio windows

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path windows -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error ("{0}: {1}" -f $_.Extent.File, $_.Message) }
            }
          }
          if ($failed) { throw 'PowerShell syntax validation failed.' }

      - name: Build Docker and native one-file EXEs
        shell: powershell
        run: .\windows\build.ps1 -Clean

      - name: Smoke-test both EXEs
        shell: powershell
        run: |
          .\dist\QQBotStudioWindows.exe --version
          .\dist\QQBotStudioWindows.exe --help | Out-Null
          .\dist\QQBotStudioWindowsNative.exe --version
          .\dist\QQBotStudioWindowsNative.exe --help | Out-Null
          .\dist\QQBotStudioWindowsNative.exe --guide | Out-Null
          .\dist\QQBotStudioWindowsNative.exe --check | Out-Null

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: QQBotStudioWindows-dual-${{ github.sha }}
          path: |
            dist/QQBotStudioWindows.exe
            dist/QQBotStudioWindowsNative.exe
            dist/SHA256SUMS.txt
            README.md
            VERSION
            LICENSE
            UPSTREAM.md
            VALIDATION.md
            docs/**
            windows/build.ps1
            windows/qqbot-studio-windows.spec
            windows/qqbot-studio-windows-native.spec
            windows/native_launcher.py
            windows/install.ps1
            windows/start.ps1
            windows/console.ps1
          if-no-files-found: error
          retention-days: 14
